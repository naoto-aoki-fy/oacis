version: '3.8'
services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      - mongo
      - redis
    environment:
      OACIS_MONGODB_URL: mongodb://mongo:27017
      OACIS_REDIS_URL: redis://redis:6379

  mongo:
    image: mongo:8.0.10-rc0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:8.0.1
    restart: unless-stopped

volumes:
  mongo_data:
